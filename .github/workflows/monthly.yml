name: Mirror Lunch Calendar (legacy link, through Aug 2026)

# This repo no longer generates menus. It mirrors the maintained pipeline's
# published feed (bruff85/graphql-calendar-pipeline) so the legacy
# subscription URL keeps working through the end of August 2026, then stops.
#
# The cron runs daily rather than on the pipeline's 27th/retry schedule: this
# job is a cheap copy, and a daily sync means a correction upstream reaches the
# legacy link within a day without this repo having to know anything about when
# menus publish.

on:
  schedule:
    - cron: '30 15 * * *'   # 8:30am PT daily — after the pipeline's 7am PT run
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      # Read the feed straight from the pipeline repo rather than its GitHub
      # Pages URL: no publish lag, and no dependency on Pages being up.
      - name: Checkout pipeline repository
        uses: actions/checkout@v4
        with:
          repository: bruff85/graphql-calendar-pipeline
          path: pipeline

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Mirror the feed
        env:
          SOURCE_URL: file://${{ github.workspace }}/pipeline/docs/lunch.ics
        run: python mirror_feed.py

      - name: Commit and push updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/lunch.ics
          git diff --staged --quiet || git commit -m "Mirror lunch calendar feed ($(date +'%Y-%m-%d'))"
          git push
