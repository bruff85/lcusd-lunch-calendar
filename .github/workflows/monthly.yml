name: Mirror Lunch Calendar (legacy link, through Aug 2026)

# This repo no longer generates menus. It mirrors the maintained pipeline's
# published feed (bruff85/graphql-calendar-pipeline) so the legacy
# subscription URL keeps working through the end of August 2026, then stops.
#
# August 2026 is already mirrored in full, so the sync has no new month left to
# wait for: the pipeline's next find is September, which the Sept 1 cutoff drops
# on the way in. The only thing a further run can pick up is an upstream
# CORRECTION to an August day, so this is weekly rather than daily — a handful
# of runs to cover that, instead of twice-a-day polling for a month that will
# never be served here.
#
# A run with nothing to do exits in seconds and pushes nothing, so the schedule
# can simply be left to lapse on Sept 1 rather than being switched off by hand.

on:
  schedule:
    - cron: '30 15 * * 1'   # Mondays 8:30am PT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      # Read the feed straight from the pipeline repo rather than its GitHub
      # Pages URL: no publish lag, and no dependency on Pages being up.
      - name: Checkout pipeline repository
        uses: actions/checkout@v4
        with:
          repository: bruff85/graphql-calendar-pipeline
          path: pipeline

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Mirror the feed
        env:
          SOURCE_URL: file://${{ github.workspace }}/pipeline/docs/lunch.ics
        run: python mirror_feed.py

      - name: Commit and push updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/lunch.ics
          git diff --staged --quiet || git commit -m "Mirror lunch calendar feed ($(date +'%Y-%m-%d'))"
          git push
